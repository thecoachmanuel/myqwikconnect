<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="QwikConnect - Connect, Chat & Dating App">
  <meta name="theme-color" content="#FE1B03">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QwikConnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>QwikConnect</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id" content="260849839740-6r3qi066dh6lka0duktr89go7t9pm4vo.apps.googleusercontent.com">

  <!-- Performance Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/notocoloremoji/v25/0FlNmVPttA2sSVGGJLsDa5u0.ttf" as="font" type="font/ttf" crossorigin>

  <script src="https://maps.googleapis.com/maps/api/js?loading=async" async defer></script>
  <!-- Agora Web RTC SDK for video calling/streaming on Web -->
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.22.0.js"></script>
  <script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js"></script>
  <!-- Paystack Inline JS for seamless in-app popup payments on Web -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    @font-face {
      font-family: 'Noto Color Emoji';
      font-style: normal;
      font-weight: 400;
      src: url('https://fonts.gstatic.com/s/notocoloremoji/v25/0FlNmVPttA2sSVGGJLsDa5u0.ttf') format('truetype');
      font-display: swap;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      position: fixed;
      overflow: hidden;
      background-color: #FAFAFA;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      touch-action: pan-x pan-y;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FFFFFF;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
    }
    .qwik-logo {
      margin-bottom: 28px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(254, 27, 3, 0.15);
      border-top-color: #FE1B03;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <!-- QwikConnect wordmark logo shown on PWA splash / initial load -->
    <svg class="qwik-logo" width="220" height="52" viewBox="0 0 220 52" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="qwikGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#FF6F43"/>
          <stop offset="60%"  stop-color="#FF4B1F"/>
          <stop offset="100%" stop-color="#FE1B03"/>
        </linearGradient>
      </defs>
      <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" letter-spacing="-2" font-weight="900" fill="url(#qwikGrad)">Qwik</text>
      <text x="118" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" letter-spacing="-2" font-weight="600" fill="#1A1A1A">Connect</text>
    </svg>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    });
  </script>

  <script>
    (function() {
      var BUILD_KEY = 'orange_app_build_version';
      var isUpdating = false;

      async function checkVersionAndUpdate() {
        if (isUpdating) return;
        try {
          var response = await fetch('version.json?t=' + Date.now(), {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
          });
          if (!response.ok) return;
          var data = await response.json();
          var currentBuild = String(data.build_number || data.version || '');
          if (!currentBuild) return;

          var savedBuild = localStorage.getItem(BUILD_KEY);
          if (savedBuild && savedBuild !== currentBuild) {
            isUpdating = true;
            console.log('[Orange Update] New build detected:', currentBuild, '(current:', savedBuild + '). Purging caches...');
            localStorage.setItem(BUILD_KEY, currentBuild);

            // Purge all Service Worker caches
            if ('caches' in window) {
              try {
                var keys = await caches.keys();
                await Promise.all(keys.map(function(k) { return caches.delete(k); }));
              } catch (e) {
                console.warn('[Orange Update] Cache purge error:', e);
              }
            }

            // Unregister all old service workers to guarantee clean boot
            if ('serviceWorker' in navigator) {
              try {
                var registrations = await navigator.serviceWorker.getRegistrations();
                for (var i = 0; i < registrations.length; i++) {
                  await registrations[i].unregister();
                }
              } catch (e) {
                console.warn('[Orange Update] SW unregister error:', e);
              }
            }

            // Instant reload with cache bust (respecting standalone PWA mode)
            var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            if (isStandalone) {
              window.location.reload();
            } else {
              window.location.replace(window.location.origin + window.location.pathname + '?v=' + currentBuild + (window.location.hash || ''));
            }
            return;
          }

          if (!savedBuild && currentBuild) {
            localStorage.setItem(BUILD_KEY, currentBuild);
          }
        } catch (e) {
          console.warn('[Orange Update] Version check skipped:', e);
        }
      }

      // Check whenever user switches back to tab or resumes installed PWA
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          checkVersionAndUpdate();
        }
      });
      window.addEventListener('focus', checkVersionAndUpdate);

      // Periodic check every 3 minutes
      setInterval(checkVersionAndUpdate, 180000);

      // Service worker handling
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var registration = registrations[i];
            registration.update();
            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            registration.addEventListener('updatefound', function() {
              var newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });
          }
        });
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          console.log('[Orange Update] Controller changed, refreshing...');
          window.location.reload();
        });
      }

      // Boot app after verifying version to ensure mobile devices never run stale code
      async function startApp() {
        try {
          await checkVersionAndUpdate();
        } catch (_) {}

        if (isUpdating) return;

        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=' + Date.now();
        script.async = true;
        document.body.appendChild(script);
      }
      startApp();
    })();
  </script>

  <script>
    // Paystack Inline JS Bridge for seamless embedded payment in Orange Web
    window.addEventListener('orange_open_paystack', function(e) {
      var data = {};
      try {
        data = typeof e.detail === 'string' ? JSON.parse(e.detail) : (e.detail || {});
      } catch (err) {
        console.warn('[Orange Paystack] Invalid detail payload:', err);
      }

      function sendResponse(status, ref, errMsg) {
        window.dispatchEvent(new CustomEvent('orange_paystack_response', {
          detail: JSON.stringify({
            status: status,
            reference: ref || data.ref || '',
            message: errMsg || ''
          })
        }));
      }

      if (typeof PaystackPop === 'undefined') {
        console.warn('[Orange Paystack] PaystackPop script not loaded, retrying load...');
        var scr = document.createElement('script');
        scr.src = 'https://js.paystack.co/v1/inline.js';
        scr.onload = function() {
          setupAndOpen();
        };
        scr.onerror = function() {
          sendResponse('error', data.ref, 'Failed to load Paystack Inline SDK');
        };
        document.head.appendChild(scr);
        return;
      }

      setupAndOpen();

      function setupAndOpen() {
        try {
          var cleanEmail = String(data.email || '').trim().toLowerCase();
          var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!cleanEmail || !emailRegex.test(cleanEmail)) {
            var uid = data.user_id || data.userId || Date.now();
            cleanEmail = 'user_' + uid + '@gmail.com';
          }

          var options = {
            key: data.key,
            email: cleanEmail,
            amount: Number(data.amount) || 10000,
            ref: data.ref || ('ORANGE_' + Date.now()),
            currency: data.currency || 'NGN',
            callback: function(response) {
              console.log('[Orange Paystack] Payment callback:', response);
              var ref = (response && (response.reference || response.trxref)) || data.ref || '';
              sendResponse('success', ref);
            },
            onClose: function() {
              console.log('[Orange Paystack] Popup closed/cancelled by user');
              sendResponse('cancelled', data.ref);
            }
          };

          if (data.access_code && String(data.access_code).trim().length > 0) {
            options.access_code = String(data.access_code).trim();
          }

          console.log('[Orange Paystack] Initializing PaystackPop with email:', options.email, 'key:', options.key ? (options.key.substring(0, 8) + '...') : 'missing');
          var handler = PaystackPop.setup(options);
          handler.openIframe();
        } catch (err) {
          console.error('[Orange Paystack Setup Error]', err);
          sendResponse('error', data.ref, err.toString());
        }
      }
    });
  </script>
</body>
</html>
