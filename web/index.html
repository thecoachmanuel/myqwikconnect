<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Orange - Connect, Chat & Dating App">
  <meta name="theme-color" content="#FE1B03">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Orange">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Orange</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id" content="260849839740-6r3qi066dh6lka0duktr89go7t9pm4vo.apps.googleusercontent.com">

  <!-- Performance Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <script src="https://maps.googleapis.com/maps/api/js?loading=async" async defer></script>
  <!-- Agora Web RTC SDK for video calling/streaming on Web -->
  <script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js" async></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      position: fixed;
      overflow: hidden;
      background-color: #FAFAFA;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      touch-action: pan-x pan-y;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FFFFFF;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(254, 27, 3, 0.15);
      border-top-color: #FE1B03;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    });
  </script>

  <script>
    (function() {
      var BUILD_KEY = 'orange_app_build_version';
      var isUpdating = false;

      async function checkVersionAndUpdate() {
        if (isUpdating) return;
        try {
          var response = await fetch('version.json?t=' + Date.now(), {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
          });
          if (!response.ok) return;
          var data = await response.json();
          var currentBuild = String(data.build_number || data.version || '');
          if (!currentBuild) return;

          var savedBuild = localStorage.getItem(BUILD_KEY);
          if (savedBuild && savedBuild !== currentBuild) {
            isUpdating = true;
            console.log('[Orange Update] New build detected:', currentBuild, '(current:', savedBuild + '). Purging caches...');
            localStorage.setItem(BUILD_KEY, currentBuild);

            // Purge all Service Worker caches
            if ('caches' in window) {
              try {
                var keys = await caches.keys();
                await Promise.all(keys.map(function(k) { return caches.delete(k); }));
              } catch (e) {
                console.warn('[Orange Update] Cache purge error:', e);
              }
            }

            // Unregister all old service workers to guarantee clean boot
            if ('serviceWorker' in navigator) {
              try {
                var registrations = await navigator.serviceWorker.getRegistrations();
                for (var i = 0; i < registrations.length; i++) {
                  await registrations[i].unregister();
                }
              } catch (e) {
                console.warn('[Orange Update] SW unregister error:', e);
              }
            }

            // Instant reload with cache bust
            window.location.replace(window.location.origin + window.location.pathname + '?v=' + currentBuild + (window.location.hash || ''));
            return;
          }

          if (!savedBuild && currentBuild) {
            localStorage.setItem(BUILD_KEY, currentBuild);
          }
        } catch (e) {
          console.warn('[Orange Update] Version check skipped:', e);
        }
      }

      // Check whenever user switches back to tab or resumes installed PWA
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          checkVersionAndUpdate();
        }
      });
      window.addEventListener('focus', checkVersionAndUpdate);

      // Periodic check every 3 minutes
      setInterval(checkVersionAndUpdate, 180000);

      // Service worker handling
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var registration = registrations[i];
            registration.update();
            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            registration.addEventListener('updatefound', function() {
              var newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });
          }
        });
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          console.log('[Orange Update] Controller changed, refreshing...');
          window.location.reload();
        });
      }

      // Boot app after verifying version to ensure mobile devices never run stale code
      async function startApp() {
        try {
          await checkVersionAndUpdate();
        } catch (_) {}

        if (isUpdating) return;

        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=' + Date.now();
        script.async = true;
        document.body.appendChild(script);
      }
      startApp();
    })();
  </script>
</body>
</html>
