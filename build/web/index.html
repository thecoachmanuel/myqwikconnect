<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="QwikConnect - Connect, Chat & Dating App">
  <meta name="theme-color" content="#FE1B03">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QwikConnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>QwikConnect</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id"
    content="260849839740-6r3qi066dh6lka0duktr89go7t9pm4vo.apps.googleusercontent.com">

  <!-- Performance Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/notocoloremoji/v25/0FlNmVPttA2sSVGGJLsDa5u0.ttf" as="font"
    type="font/ttf" crossorigin>

  <script src="https://maps.googleapis.com/maps/api/js?loading=async" async defer></script>
  <!-- Agora Web RTC SDK for video calling/streaming on Web -->
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.22.0.js"></script>
  <script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js"></script>
  <!-- Paystack Inline JS for seamless in-app popup payments on Web -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    @font-face {
      font-family: 'Noto Color Emoji';
      font-style: normal;
      font-weight: 400;
      src: url('https://fonts.gstatic.com/s/notocoloremoji/v25/0FlNmVPttA2sSVGGJLsDa5u0.ttf') format('truetype');
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      position: fixed;
      overflow: hidden;
      background-color: #FAFAFA;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      touch-action: pan-x pan-y;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FFFFFF;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(254, 27, 3, 0.15);
      border-top-color: #FE1B03;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #update-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999999;
      background: linear-gradient(90deg, #FF6F43, #FE1B03);
      color: white;
      text-align: center;
      padding: 12px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-100%);
      }

      to {
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
  </div>
  <div id="update-banner" onclick="window.location.reload(true)">
    🚀 New update available — tap to refresh!
  </div>

  <script>
    function removeLoader() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoader);
    // Safety fallback: ensure spinner never traps the user permanently
    setTimeout(removeLoader, 4500);
  </script>

  <!-- Load Flutter Bootstrap directly so Flutter always boots immediately -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    (function () {
      var BUILD_KEY = 'orange_app_build_version';

      async function checkVersionAndUpdate() {
        try {
          var response = await fetch('version.json?t=' + Date.now(), {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
          });
          if (!response.ok) return;
          var data = await response.json();
          var currentBuild = String(data.build_number || data.version || '');
          if (!currentBuild) return;

          var savedBuild = localStorage.getItem(BUILD_KEY);
          if (savedBuild && savedBuild !== currentBuild) {
            console.log('[QwikConnect] New build detected:', currentBuild, '← was:', savedBuild);
            localStorage.setItem(BUILD_KEY, currentBuild);

            // Purge Service Worker caches
            if ('caches' in window) {
              try {
                var keys = await caches.keys();
                await Promise.all(keys.map(function (k) { return caches.delete(k); }));
              } catch (e) { }
            }

            // Show update banner so user can tap to get newest features
            var banner = document.getElementById('update-banner');
            if (banner) { banner.style.display = 'block'; }
            return;
          }

          if (!savedBuild && currentBuild) {
            localStorage.setItem(BUILD_KEY, currentBuild);
          }
        } catch (e) {
          console.warn('[QwikConnect] Version check skipped:', e);
        }
      }

      // Check on visibility change (user switching back to tab/PWA)
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          checkVersionAndUpdate();
        }
      });
      window.addEventListener('focus', checkVersionAndUpdate);

      // Background check after app loads
      setTimeout(checkVersionAndUpdate, 2000);
      setInterval(checkVersionAndUpdate, 180000);

      // Service worker handling
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var registration = registrations[i];
            registration.update();
            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          }
        });
      }
    })();
  </script>

  <script>
    // Paystack Inline JS Bridge for seamless embedded payment in Orange Web
    window.addEventListener('orange_open_paystack', function (e) {
      var data = {};
      try {
        data = typeof e.detail === 'string' ? JSON.parse(e.detail) : (e.detail || {});
      } catch (err) {
        console.warn('[Orange Paystack] Invalid detail payload:', err);
      }

      function sendResponse(status, ref, errMsg) {
        window.dispatchEvent(new CustomEvent('orange_paystack_response', {
          detail: JSON.stringify({
            status: status,
            reference: ref || data.ref || '',
            message: errMsg || ''
          })
        }));
      }

      if (typeof PaystackPop === 'undefined') {
        console.warn('[Orange Paystack] PaystackPop script not loaded, retrying load...');
        var scr = document.createElement('script');
        scr.src = 'https://js.paystack.co/v1/inline.js';
        scr.onload = function () {
          setupAndOpen();
        };
        scr.onerror = function () {
          sendResponse('error', data.ref, 'Failed to load Paystack Inline SDK');
        };
        document.head.appendChild(scr);
        return;
      }

      setupAndOpen();

      function setupAndOpen() {
        try {
          var cleanEmail = String(data.email || '').trim().toLowerCase();
          var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!cleanEmail || !emailRegex.test(cleanEmail)) {
            var uid = data.user_id || data.userId || Date.now();
            cleanEmail = 'user_' + uid + '@gmail.com';
          }

          var options = {
            key: data.key,
            email: cleanEmail,
            amount: Number(data.amount) || 10000,
            ref: data.ref || ('ORANGE_' + Date.now()),
            currency: data.currency || 'NGN',
            callback: function (response) {
              console.log('[Orange Paystack] Payment callback:', response);
              var ref = (response && (response.reference || response.trxref)) || data.ref || '';
              sendResponse('success', ref);
            },
            onClose: function () {
              console.log('[Orange Paystack] Popup closed/cancelled by user');
              sendResponse('cancelled', data.ref);
            }
          };

          if (data.access_code && String(data.access_code).trim().length > 0) {
            options.access_code = String(data.access_code).trim();
          }

          console.log('[Orange Paystack] Initializing PaystackPop with email:', options.email, 'key:', options.key ? (options.key.substring(0, 8) + '...') : 'missing');
          var handler = PaystackPop.setup(options);
          handler.openIframe();
        } catch (err) {
          console.error('[Orange Paystack Setup Error]', err);
          sendResponse('error', data.ref, err.toString());
        }
      }
    });
  </script>
</body>

</html>
